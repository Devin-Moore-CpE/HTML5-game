<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Hockey 1v1</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #lobby {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .btn {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: #2563eb; }
  .btn:disabled { background: #475569; cursor: not-allowed; }
  #status { font-size: 14px; color: #94a3b8; }
  #game-container {
    position: relative;
    border: 4px solid #334155;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    background: #020617;
  }
  canvas { display: block; cursor: none; }
  #overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.75);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
  }
  #winnerText { font-size: 32px; font-weight: 700; margin-bottom: 16px; }
</style>
</head>
<body>

<div id="lobby">
  <div id="status">Connecting to cloud signaling...</div>
  <button id="copyBtn" class="btn" style="display: none;">Copy Invite Link</button>
</div>

<div id="game-container">
  <canvas id="rink" width="800" height="450"></canvas>
  <div id="overlay">
    <div id="winnerText">Player Wins!</div>
    <button id="rematchBtn" class="btn">Play Again</button>
  </div>
</div>

<script>
const WIDTH = 800;
const HEIGHT = 450;
const WINNING_SCORE = 5;
const GOAL_SIZE = 160;
const PADDLE_RADIUS = 28;
const PUCK_RADIUS = 16;

const canvas = document.getElementById('rink');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');
const copyBtn = document.getElementById('copyBtn');
const overlay = document.getElementById('overlay');
const winnerText = document.getElementById('winnerText');
const rematchBtn = document.getElementById('rematchBtn');

let peer = null;
let conn = null;
let isHost = false;
let connected = false;

// Game State
let scores = { host: 0, client: 0 };
let hostPaddle = { x: 120, y: HEIGHT / 2 };
let clientPaddle = { x: WIDTH - 120, y: HEIGHT / 2 };
let puck = { x: WIDTH / 2, y: HEIGHT / 2, vx: 0, vy: 0 };
let gameOver = false;

// Determine role via URL fragment
const remotePeerId = window.location.hash.substring(1);
isHost = !remotePeerId;

peer = new Peer();

peer.on('open', (id) => {
  if (isHost) {
    statusDiv.textContent = "Waiting for friend to join...";
    copyBtn.style.display = "inline-block";
    copyBtn.onclick = () => {
      const shareUrl = `${window.location.origin}${window.location.pathname}#${id}`;
      navigator.clipboard.writeText(shareUrl);
      copyBtn.textContent = "Link Copied!";
      setTimeout(() => copyBtn.textContent = "Copy Invite Link", 2000);
    };
  } else {
    statusDiv.textContent = "Connecting to host...";
    conn = peer.connect(remotePeerId, { reliable: false });
    setupConnection();
  }
});

peer.on('connection', (incoming) => {
  if (isHost) {
    conn = incoming;
    setupConnection();
  }
});

function setupConnection() {
  conn.on('open', () => {
    connected = true;
    statusDiv.textContent = isHost ? "Connected! (You are Red - Left)" : "Connected! (You are Blue - Right)";
    copyBtn.style.display = "none";
    if (isHost) resetPuck();
  });

  conn.on('data', (data) => {
    if (data.type === 'clientPaddle') {
      clientPaddle.x = data.x;
      clientPaddle.y = data.y;
    } else if (data.type === 'gameState') {
      hostPaddle = data.hostPaddle;
      puck = data.puck;
      scores = data.scores;
      if (data.gameOver && !gameOver) {
        showGameOver(data.winner);
      } else if (!data.gameOver && gameOver) {
        overlay.style.display = 'none';
        gameOver = false;
      }
    } else if (data.type === 'restart') {
      scores = { host: 0, client: 0 };
      gameOver = false;
      overlay.style.display = 'none';
      if (isHost) resetPuck();
    }
  });

  conn.on('close', () => {
    connected = false;
    statusDiv.textContent = "Player disconnected.";
  });
}

// Mouse tracking
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = WIDTH / rect.width;
  const scaleY = HEIGHT / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  if (isHost) {
    hostPaddle.x = Math.max(PADDLE_RADIUS, Math.min(WIDTH / 2 - PADDLE_RADIUS, mx));
    hostPaddle.y = Math.max(PADDLE_RADIUS, Math.min(HEIGHT - PADDLE_RADIUS, my));
  } else {
    clientPaddle.x = Math.max(WIDTH / 2 + PADDLE_RADIUS, Math.min(WIDTH - PADDLE_RADIUS, mx));
    clientPaddle.y = Math.max(PADDLE_RADIUS, Math.min(HEIGHT - PADDLE_RADIUS, my));
    if (connected && conn.open) {
      conn.send({ type: 'clientPaddle', x: clientPaddle.x, y: clientPaddle.y });
    }
  }
});

function resetPuck(scorer) {
  puck.x = WIDTH / 2;
  puck.y = HEIGHT / 2;
  const dir = scorer === 'host' ? 1 : -1;
  puck.vx = dir * 4;
  puck.vy = (Math.random() - 0.5) * 4;
}

function handlePhysics() {
  puck.x += puck.vx;
  puck.y += puck.vy;

  // Surface friction
  puck.vx *= 0.992;
  puck.vy *= 0.992;

  // Max velocity cap
  const maxSpd = 16;
  const speed = Math.hypot(puck.vx, puck.vy);
  if (speed > maxSpd) {
    puck.vx = (puck.vx / speed) * maxSpd;
    puck.vy = (puck.vy / speed) * maxSpd;
  }

  // Top/Bottom walls
  if (puck.y - PUCK_RADIUS <= 0) {
    puck.y = PUCK_RADIUS;
    puck.vy = -puck.vy * 0.95;
  } else if (puck.y + PUCK_RADIUS >= HEIGHT) {
    puck.y = HEIGHT - PUCK_RADIUS;
    puck.vy = -puck.vy * 0.95;
  }

  const goalYStart = (HEIGHT - GOAL_SIZE) / 2;
  const goalYEnd = (HEIGHT + GOAL_SIZE) / 2;

  // Left wall / Goal
  if (puck.x - PUCK_RADIUS <= 0) {
    if (puck.y >= goalYStart && puck.y <= goalYEnd) {
      scores.client++;
      checkWin('Blue');
      resetPuck('client');
    } else {
      puck.x = PUCK_RADIUS;
      puck.vx = -puck.vx * 0.95;
    }
  }

  // Right wall / Goal
  if (puck.x + PUCK_RADIUS >= WIDTH) {
    if (puck.y >= goalYStart && puck.y <= goalYEnd) {
      scores.host++;
      checkWin('Red');
      resetPuck('host');
    } else {
      puck.x = WIDTH - PUCK_RADIUS;
      puck.vx = -puck.vx * 0.95;
    }
  }

  // Paddle collisions
  resolvePaddleCollision(hostPaddle);
  resolvePaddleCollision(clientPaddle);
}

function resolvePaddleCollision(paddle) {
  const dx = puck.x - paddle.x;
  const dy = puck.y - paddle.y;
  const dist = Math.hypot(dx, dy);
  const minDist = PADDLE_RADIUS + PUCK_RADIUS;

  if (dist < minDist && dist > 0) {
    const nx = dx / dist;
    const ny = dy / dist;
    puck.x = paddle.x + nx * minDist;
    puck.y = paddle.y + ny * minDist;

    const normalVel = puck.vx * nx + puck.vy * ny;
    puck.vx = (puck.vx - 2 * normalVel * nx) + nx * 5;
    puck.vy = (puck.vy - 2 * normalVel * ny) + ny * 5;
  }
}

function checkWin(winnerName) {
  if (scores.host >= WINNING_SCORE || scores.client >= WINNING_SCORE) {
    gameOver = true;
    showGameOver(winnerName);
  }
}

function showGameOver(winner) {
  winnerText.textContent = `${winner} Wins Round! (First to ${WINNING_SCORE})`;
  overlay.style.display = 'flex';
}

rematchBtn.onclick = () => {
  scores = { host: 0, client: 0 };
  gameOver = false;
  overlay.style.display = 'none';
  if (isHost) {
    resetPuck();
  } else if (conn && conn.open) {
    conn.send({ type: 'restart' });
  }
};

// Render Loop
function render() {
  if (isHost && connected && !gameOver) {
    handlePhysics();
    if (conn && conn.open) {
      conn.send({
        type: 'gameState',
        hostPaddle,
        puck,
        scores,
        gameOver,
        winner: scores.host >= WINNING_SCORE ? 'Red' : 'Blue'
      });
    }
  }

  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  // Center Line & Circle
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(WIDTH / 2, 0);
  ctx.lineTo(WIDTH / 2, HEIGHT);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(WIDTH / 2, HEIGHT / 2, 70, 0, Math.PI * 2);
  ctx.stroke();

  // Goals
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(0, (HEIGHT - GOAL_SIZE) / 2);
  ctx.lineTo(0, (HEIGHT + GOAL_SIZE) / 2);
  ctx.stroke();

  ctx.strokeStyle = '#3b82f6';
  ctx.beginPath();
  ctx.moveTo(WIDTH, (HEIGHT - GOAL_SIZE) / 2);
  ctx.lineTo(WIDTH, (HEIGHT + GOAL_SIZE) / 2);
  ctx.stroke();

  // Scores
  ctx.font = '64px sans-serif';
  ctx.fillStyle = '#ef444433';
  ctx.fillText(scores.host, WIDTH / 4, 90);
  ctx.fillStyle = '#3b82f633';
  ctx.fillText(scores.client, (WIDTH / 4) * 3, 90);

  // Paddles
  drawCircle(hostPaddle.x, hostPaddle.y, PADDLE_RADIUS, '#ef4444');
  drawCircle(clientPaddle.x, clientPaddle.y, PADDLE_RADIUS, '#3b82f6');

  // Puck
  drawCircle(puck.x, puck.y, PUCK_RADIUS, '#f8fafc');

  requestAnimationFrame(render);
}

function drawCircle(x, y, r, color) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();
}

render();
</script>
</body>
</html>
